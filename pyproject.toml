[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "itas-archive"
version = "1.0.0"
description = "Audit tooling for the Inside the Actors Studio archive"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Bannatar" }]
keywords = ["archive", "television", "media-preservation", "google-drive"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Video",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.scripts]
itas = "itas.cli:main"

[project.urls]
Homepage = "https://github.com/Unnidentified/inside-the-actors-studio-archive"
Changelog = "https://github.com/Unnidentified/inside-the-actors-studio-archive/blob/main/docs/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["itas*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
